<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estatísticas – Restaurante Rio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="page-banners"></div>
  <header class="site-header">
    <div>
      <h1>Estatísticas</h1>
      <p>Atualizam automaticamente com novos pedidos</p>
    </div>
  </header>
  <nav class="staff-nav">
    <a href="admin.html">Admin</a>
    <a href="stats.html" class="active">Stats</a>
    <a href="cloud.html">Cloud</a>
  </nav>
  <main>
    <section class="stats-grid">
      <div class="stat-card"><h3>Total de pedidos</h3><div class="value" id="stat-total-orders">–</div></div>
      <div class="stat-card"><h3>Total faturado</h3><div class="value" id="stat-total-revenue">–</div></div>
      <div class="stat-card"><h3>Ticket médio</h3><div class="value" id="stat-average-ticket">–</div></div>
    </section>
    <section class="chart-section">
      <h2>Pedidos por dia (últimos 7 dias)</h2>
      <div id="chart-orders-per-day" class="bar-chart"></div>
    </section>
    <section class="chart-section">
      <h2>Top 5 pratos</h2>
      <div id="chart-top-dishes" class="bar-chart"></div>
    </section>
  </main>
  <script src="menu-data.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
</body>
</html>

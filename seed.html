<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8" />
    <title>Seed – Menu Digital</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Seed – Criar dados de exemplo</h1>
    </header>

    <main>
        <p>Este script cria restaurantes e pratos de exemplo no Firebase.</p>
        <button id="run-seed"
            style="padding: 0.6rem 1.2rem; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
            Correr seed
        </button>
        <p id="seed-result" style="margin-top: 1rem;"></p>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="seed.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backoffice – Menu</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Backoffice</h1>
        <p>Gestão de restaurantes e histórico de pedidos</p>
    </header>

    <main>
        <!-- Login -->
        <section id="login-section">
            <h2>Login</h2>
            <p>Introduz a password para aceder ao backoffice.</p>
            <input type="password" id="admin-password" placeholder="Password"
                style="padding: 0.5rem; width: 200px; margin-right: 0.5rem;" />
            <button id="btn-login" style="padding: 0.5rem 1rem;">Entrar</button>
            <p id="login-error" style="color: #b91c1c; margin-top: 0.5rem;"></p>
        </section>

        <!-- Conteúdo do admin (só visível após login) -->
        <section id="admin-content" style="display: none;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                <h2 style="margin: 0;">Histórico de pedidos</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <a href="stats.html" style="text-decoration: none;">
                        <button type="button" style="padding: 0.5rem 1rem;">Estatísticas</button>
                    </a>
                    <button id="btn-export-csv" style="padding: 0.5rem 1rem;">Exportar CSV</button>
                    <button id="btn-logout" style="padding: 0.5rem 1rem;">Sair</button>
                </div>
            </div>

            <p>Filtros:</p>

            <!-- Filtros -->
            <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem;">
                <!-- Filtro por restaurante -->
                <select id="filter-restaurant" style="padding: 0.5rem;">
                    <option value="">Todos os restaurantes</option>
                    <!-- Opções preenchidas via JS -->
                </select>

                <!-- Filtro por estado -->
                <select id="filter-status" style="padding: 0.5rem;">
                    <option value="">Todos os estados</option>
                    <option value="new">Novos</option>
                    <option value="preparing">Em preparação</option>
                    <option value="ready">Prontos</option>
                    <option value="completed">Concluídos</option>
                </select>
            </div>

            <div id="orders-history" class="orders-container">
                <!-- Pedidos carregados via JS -->
            </div>
        </section>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>

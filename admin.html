<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Restaurante Rio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="page-banners"></div>
  <header class="site-header">
    <div>
      <h1>Backoffice</h1>
      <p>Pedidos, ementa, faturação e fecho de caixa</p>
    </div>
  </header>
  <nav class="staff-nav">
    <a href="index.html">Menu</a>
    <a href="cozinha.html">Cozinha</a>
    <a href="admin.html" class="active">Admin</a>
    <a href="cloud.html">Cloud</a>
    <a href="ficha.html">Fichas</a>
    <a href="loica.html">Loiça</a>
    <a href="stats.html">Stats</a>
    <a href="seed.html">Seed</a>
  </nav>
  <main>
    <section id="login-section" class="card-panel">
      <h2>Login</h2>
      <p class="muted">Password de demonstração: <code>admin123</code></p>
      <div class="row">
        <input type="password" id="admin-password" placeholder="Password" />
        <button id="btn-login" class="btn-primary">Entrar</button>
      </div>
      <p id="login-error" class="error"></p>
    </section>

    <section id="admin-content" style="display:none">
      <div class="admin-toolbar">
        <div class="tabs">
          <button type="button" class="chip active" data-tab="orders">Pedidos</button>
          <button type="button" class="chip" data-tab="menu">Gestão de ementa</button>
          <button type="button" class="chip" data-tab="cash">Fecho de caixa</button>
        </div>
        <div class="row">
          <a href="cloud.html"><button type="button" class="btn-ghost">Monitorização Cloud</button></a>
          <button id="btn-export-csv" class="btn-ghost">Exportar CSV</button>
          <button id="btn-logout" class="btn-ghost">Sair</button>
        </div>
      </div>

      <div id="panel-orders" class="admin-panel">
        <label>Estado
          <select id="filter-status">
            <option value="">Todos</option>
            <option value="new">Novos</option>
            <option value="preparing">Em preparação</option>
            <option value="ready">Prontos</option>
            <option value="completed">Concluídos</option>
          </select>
        </label>
        <div id="orders-history" class="orders-container"></div>
      </div>

      <div id="panel-menu" class="admin-panel" hidden>
        <h2>Gestão de ementa</h2>
        <p class="muted">Marca pratos como indisponíveis quando esgotarem.</p>
        <div id="menu-admin-list" class="admin-dish-list"></div>
      </div>

      <div id="panel-cash" class="admin-panel" hidden>
        <h2>Fecho de caixa</h2>
        <div class="row wrap">
          <label>Data <input type="date" id="cash-date" /></label>
          <label>Turno
            <select id="cash-shift">
              <option value="manha">Manhã</option>
              <option value="tarde" selected>Tarde</option>
              <option value="noite">Noite</option>
            </select>
          </label>
          <label>Dinheiro contado (€) <input type="number" id="cash-counted" step="0.01" value="0" /></label>
          <button type="button" id="btn-close-shift" class="btn-primary">Fechar turno</button>
        </div>
        <div id="cash-summary"></div>
        <h3>Histórico de fechos</h3>
        <div id="cash-history"></div>
      </div>
    </section>
  </main>
  <script src="menu-data.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
</body>
</html>

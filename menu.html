<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu – Restaurante</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Menu</h1>
        <p id="restaurant-name">A carregar restaurante...</p>
    </header>

    <main>
        <section id="menu-section">
            <h2>Pratos</h2>
            <div id="menu-list">A carregar menu...</div>
        </section>

        <section id="cart-section">
            <h2>Seu pedido</h2>
            <div id="cart-list">O carrinho está vazio.</div>
            <p>Total: <strong id="cart-total">0,00 €</strong></p>
            <button id="send-order" type="button">Enviar pedido</button>
        </section>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu – Restaurante</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1 id="restaurant-name">A carregar...</h1>
        <p>Escolhe os teus pratos</p>
    </header>

    <main>
        <!-- Filtros por categoria -->
        <section id="category-filters" style="margin-bottom: 1.5rem;">
            <!-- Botões inseridos via JS -->
        </section>

        <!-- Lista de pratos -->
        <section id="menu-section">
            <div id="menu-list"></div>
        </section>

        <!-- Carrinho -->
        <section id="cart-section">
            <h2>O teu pedido</h2>
            <div id="cart-list">O carrinho está vazio.</div>
            <div style="margin-top: 0.5rem; font-weight: 600;">
                Total: <span id="cart-total">0,00 €</span>
            </div>
            <button id="send-order">Enviar pedido</button>
        </section>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>

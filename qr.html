<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code – Menu Digital</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>QR Code do Menu</h1>
      <p>Aponta para o menu atual</p>
    </div>
  </header>
  <nav class="staff-nav">
    <a href="index.html">Menu</a>
    <a href="qr.html" class="active">QR</a>
  </nav>
  <main>
    <div class="qr-card">
      <img id="qr-image" alt="QR Code do menu" width="280" height="280" />
      <p class="hint">URL: <code id="qr-url"></code></p>
      <div class="row wrap" style="margin-top:1rem;justify-content:center">
        <input type="url" id="qr-custom-url" placeholder="URL personalizado (opcional)" style="min-width:240px" />
        <button type="button" id="qr-regen" class="btn-primary">Gerar QR</button>
      </div>
    </div>
  </main>
  <script src="menu-data.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
</body>
</html>

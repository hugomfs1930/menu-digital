<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <title>QR Code – Menu Digital</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 1rem;
            color: #111;
        }

        p {
            margin: 0 0 1.5rem;
            color: #555;
            font-size: 0.95rem;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>QR Code do Menu</h1>
        <p>Aponta a câmara do telemóvel para este QR code para abrir o menu.</p>

        <!-- Substitui o src pelo URL da tua imagem de QR code -->
        <img src="qr-code.png" alt="QR Code do menu" />

        <p class="hint">
            Se não tiveres a imagem no projeto, podes gerar o QR code online e fazer upload para o repositório com o
            nome <code>qr-code.png</code>.
        </p>
    </div>
</body>

</html>
